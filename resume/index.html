"polite">统计加载中…</span></span><span class="site-stats__separator" aria-hidden="true">·</span><span class="site-stats__item">Powered by <a href="https://astro.build/" rel="noreferrer" target="_blank">Astro</a></span></p></footer><script>(function(){const copyLabel = "复制";
const copiedLabel = "已复制";
const statsUnavailableLabel = "统计暂不可用";
const statsEndpoint = "https://lizi-stack-analytics.vercel.app/api/public/blog-stats";

      (() => {
        const status = document.querySelector('[data-site-stats-status]');
        const counts = document.querySelector('[data-site-stats-counts]');
        const articleViews = document.querySelector('[data-article-views]');

        const isValidStats = (stats) => {
          const pvValue = stats?.pv;
          const uvValue = stats?.uv;
          return Number.isSafeInteger(pvValue)
            && Number.isSafeInteger(uvValue)
            && pvValue >= 0
            && uvValue >= 0
            && uvValue <= pvValue;
        };

        const showFailure = () => {
          if (counts) counts.hidden = true;
          if (status) {
            status.hidden = false;
            status.textContent = statsUnavailableLabel;
          }
        };

        const showStats = (stats) => {
          if (!isValidStats(stats)) throw new Error('Invalid statistics');

          const pvValue = stats.pv;
          const uvValue = stats.uv;

          const pv = document.querySelector('[data-site-pv]');
          const uv = document.querySelector('[data-site-uv]');
          if (pv) pv.textContent = pvValue.toLocaleString();
          if (uv) uv.textContent = uvValue.toLocaleString();
          if (counts) counts.hidden = false;
          if (status) status.hidden = true;
        };

        const showArticleViews = (stats) => {
          if (!articleViews || !isValidStats(stats)) return;
          const articlePv = articleViews.querySelector('[data-article-pv]');
          if (!articlePv) return;
          articlePv.textContent = stats.pv.toLocaleString();
          articleViews.hidden = false;
        };

        const loadSiteStats = async () => {
          if (!statsEndpoint) {
            showFailure();
            return;
          }

          const controller = new AbortController();
          let settled = false;
          const timer = window.setTimeout(() => {
            settled = true;
            controller.abort();
            showFailure();
          }, 10000);

          try {
            const endpoint = new URL(statsEndpoint, window.location.href);
            if (articleViews) endpoint.searchParams.set('path', window.location.pathname);
            const response = await fetch(endpoint, {
              credentials: 'omit',
              signal: controller.signal
            });
            if (!response.ok) throw new Error('Statistics unavailable');
            const result = await response.json();
            if (settled || result?.source !== 'umami-self-hosted') return;
            showStats(result.site);
            showArticleViews(result.page);
          } catch {
            if (!settled) showFailure();
          } finally {
            settled = true;
            window.clearTimeout(timer);
          }
        };

        loadSiteStats();

        document.querySelectorAll('.prose pre').forEach((block) => {
          const code = block.querySelector('code');
          if (!code || block.querySelector('.copy-code')) return;
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'copy-code';
          button.textContent = copyLabel;
          button.addEventListener('click', async () => {
            const value = code.textContent ?? '';
            try {
              await navigator.clipboard.writeText(value);
            } catch {
              return;
            }
            button.textContent = copiedLabel;
            button.classList.add('is-copied');
            window.setTimeout(() => {
              button.textContent = copyLabel;
              button.classList.remove('is-copied');
            }, 1600);
          });
          block.appendChild(button);
        });

        const tocEntries = [...document.querySelectorAll('[data-toc-link]')].map((link) => {
          const hash = link.getAttribute('href')?.slice(1) ?? '';
          let id = hash;
          try { id = decodeURIComponent(hash); } catch { /* Keep the original hash. */ }
          return { link, id };
        }).filter(({ id }) => id);

        if (tocEntries.length > 0) {
          const seen = new Set();
          const headings = tocEntries
            .map(({ id }) => document.getElementById(id))
            .filter((heading) => heading && !seen.has(heading.id) && seen.add(heading.id));
          let activeId = '';
          let frame = 0;

          const setActive = (id) => {
            if (!id || id === activeId) return;
            activeId = id;
            tocEntries.forEach(({ link, id: linkId }) => {
              const active = linkId === id;
              link.classList.toggle('is-active', active);
              if (active) link.setAttribute('aria-current', 'location');
              else link.removeAttribute('aria-current');
            });
          };

          const updateActiveHeading = () => {
            frame = 0;
            const readingLine = Math.min(180, window.innerHeight * .28);
            let current = headings[0]?.id ?? '';
            headings.forEach((heading) => {
              if (heading.getBoundingClientRect().top <= readingLine) current = heading.id;
            });
            const atPageEnd = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 12;
            if (atPageEnd && headings.length > 0) current = headings[headings.length - 1].id;
            setActive(current);
          };

          const requestUpdate = () => {
            if (!frame) frame = window.requestAnimationFrame(updateActiveHeading);
          };

          window.addEventListener('scroll', requestUpdate, { passive: true });
          window.addEventListener('resize', requestUpdate);
          window.addEventListener('hashchange', requestUpdate);
          tocEntries.forEach(({ link, id }) => link.addEventListener('click', () => setActive(id)));
          updateActiveHeading();
        }

        const mobileMenu = document.querySelector('.mobile-menu');
        if (mobileMenu instanceof HTMLDetailsElement) {
          const summary = mobileMenu.querySelector('summary');
          const closeMenu = () => {
            if (mobileMenu.open) mobileMenu.open = false;
          };

          document.addEventListener('click', (event) => {
            if (mobileMenu.open && event.target instanceof Node && !mobileMenu.contains(event.target)) {
              closeMenu();
            }
          });

          document.addEventListener('keydown', (event) => {
            if (event.key !== 'Escape' || !mobileMenu.open) return;
            closeMenu();
            if (summary instanceof HTMLElement) summary.focus();
          });

          mobileMenu.querySelectorAll('nav a').forEach((link) => link.addEventListener('click', closeMenu));
        }

      })();
    })();</script></body></html>
