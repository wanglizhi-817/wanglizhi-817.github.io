class="search-link" href="/search/" aria-label="搜索"><span aria-hidden="true">⌕</span><span>搜索</span></a><a class="language-switch" href="/en/now/" aria-label="切换语言"><span class="current-language">中</span><span>EN</span></a></div><details class="mobile-menu"><summary aria-label="菜单"><span class="menu-icon" aria-hidden="true"><i></i><i></i></span><span>菜单</span></summary><nav aria-label="主导航"><a href="/">文章</a><a href="/archive/">归档</a><a href="/resources/">资料</a><a href="/about/">关于</a></nav></details></div></header><main id="main" data-pagefind-body><section class="page-heading wrap narrow"><p class="eyebrow">NOW</p><h1>最近在忙什么。</h1><p>更新于 2026 年 11 月。</p></section><section class="wrap narrow prose about-copy"><h2>正在学习</h2><p>在看用户行为建模，也继续补推荐系统和 Agent 工程。</p><h2>正在构建</h2><p>整理过去的实验和论文笔记，顺便把这个博客慢慢补起来。</p><h2>正在练习</h2><p>尽量把问题写清楚，不急着把每件事总结成方法论。</p></section></main><footer class="site-footer" data-pagefind-ignore><div class="footer-inner"><p>© 2026 吃栗子不 · Don’t compare</p><a href="/rss.xml">RSS</a></div><p class="site-stats"><span>全站访问（PV） —</span><span>全站访客（UV） —</span><span>Powered by <a href="https://astro.build/" rel="noreferrer" target="_blank">Astro</a></span></p></footer><script>(function(){const copyLabel = "复制";
const copiedLabel = "已复制";

      (() => {
        document.querySelectorAll('.prose pre').forEach((block) => {
          const code = block.querySelector('code');
          if (!code || block.querySelector('.copy-code')) return;
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'copy-code';
          button.textContent = copyLabel;
          button.addEventListener('click', async () => {
            const value = code.textContent ?? '';
            try {
              await navigator.clipboard.writeText(value);
            } catch {
              return;
            }
            button.textContent = copiedLabel;
            button.classList.add('is-copied');
            window.setTimeout(() => {
              button.textContent = copyLabel;
              button.classList.remove('is-copied');
            }, 1600);
          });
          block.appendChild(button);
        });

        const tocEntries = [...document.querySelectorAll('[data-toc-link]')].map((link) => {
          const hash = link.getAttribute('href')?.slice(1) ?? '';
          let id = hash;
          try { id = decodeURIComponent(hash); } catch { /* Keep the original hash. */ }
          return { link, id };
        }).filter(({ id }) => id);

        if (tocEntries.length > 0) {
          const seen = new Set();
          const headings = tocEntries
            .map(({ id }) => document.getElementById(id))
            .filter((heading) => heading && !seen.has(heading.id) && seen.add(heading.id));
          let activeId = '';
          let frame = 0;

          const setActive = (id) => {
            if (!id || id === activeId) return;
            activeId = id;
            tocEntries.forEach(({ link, id: linkId }) => {
              const active = linkId === id;
              link.classList.toggle('is-active', active);
              if (active) link.setAttribute('aria-current', 'location');
              else link.removeAttribute('aria-current');
            });
          };

          const updateActiveHeading = () => {
            frame = 0;
            const readingLine = Math.min(180, window.innerHeight * .28);
            let current = headings[0]?.id ?? '';
            headings.forEach((heading) => {
              if (heading.getBoundingClientRect().top <= readingLine) current = heading.id;
            });
            const atPageEnd = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 12;
            if (atPageEnd && headings.length > 0) current = headings[headings.length - 1].id;
            setActive(current);
          };

          const requestUpdate = () => {
            if (!frame) frame = window.requestAnimationFrame(updateActiveHeading);
          };

          window.addEventListener('scroll', requestUpdate, { passive: true });
          window.addEventListener('resize', requestUpdate);
          window.addEventListener('hashchange', requestUpdate);
          tocEntries.forEach(({ link, id }) => link.addEventListener('click', () => setActive(id)));
          updateActiveHeading();
        }

      })();
    })();</script></body></html>
